<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا — فورية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav class="wrap">
    <a href="forya-landing-ar.html" class="logo">
      <div class="logo-mark">
        <img src="logo.png" alt="Forya Logo" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">
      </div>
      فورية
    </a>
    <div class="nav-cta">
      <a href="contact.html" class="btn btn-ghost lang-toggle" style="padding: 11px; font-size: 13px;">English</a>
    </div>
  </nav>
</header>
<main>
  <div class="wrap">
    <div class="form-container">
      <h2>ابدأ مع فورية</h2>
      <p>املأ النموذج أدناه وسيقوم فريقنا بالتواصل معك خلال ٤-٦ ساعات لإعداد حسابك.</p>
      <form id="foryaContactFormAr">
        <div class="form-group">
          <label for="contactName">الاسم بالكامل</label>
          <input type="text" id="contactName" name="name" required placeholder="أحمد محمد">
        </div>
        <div class="form-group">
          <label for="contactBusiness">اسم المركز</label>
          <input type="text" id="contactBusiness" name="business" required placeholder="سايبر نوفا جيمنج">
        </div>
        <div class="form-group">
          <label for="contactPhone">رقم الهاتف</label>
          <input type="tel" id="contactPhone" name="phone" required placeholder="٠١X XXXX XXXX">
        </div>
        <div class="form-group">
          <label for="contactEmail">البريد الإلكتروني</label>
          <input type="email" id="contactEmail" name="email" required placeholder="ahmed@example.com">
        </div>
        <button type="submit" class="btn btn-primary form-submit">إرسال الطلب</button>
      </form>
    </div>
  </div>
</main>

<!-- Firebase SDKs -->
<script defer src="/__/firebase/12.16.0/firebase-app-compat.js"></script>
<script defer src="/__/firebase/12.16.0/firebase-firestore-compat.js"></script>
<script defer src="/__/firebase/init.js?useEmulator=true"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const plan = urlParams.get('plan') || 'none';
    const billing = urlParams.get('billing') || 'none';

    const form = document.getElementById('foryaContactFormAr');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const submitBtn = form.querySelector('.form-submit');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'جاري الإرسال...';
      submitBtn.disabled = true;

      const data = {
        name: document.getElementById('contactName').value,
        businessName: document.getElementById('contactBusiness').value,
        phone: document.getElementById('contactPhone').value,
        email: document.getElementById('contactEmail').value,
        package: plan,
        billing: billing,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      firebase.firestore().collection('leads').add(data)
        .then(() => {
          alert('تم إرسال الطلب بنجاح! سيتواصل فريقنا معك قريباً.');
          window.location.href = 'forya-landing-ar.html';
        })
        .catch((error) => {
          console.error('Error adding document: ', error);
          alert('حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى.');
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        });
    });
  });
</script>
</body>
</html>
